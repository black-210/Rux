[package]
name = "nabda_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI compiler and runtime binaries (nabda & nabdac) for the Nabda programming language"

[[bin]]
name = "nabda"
path = "src/main.rs"

[[bin]]
name = "nabdac"
path = "src/nabdac.rs"

[dependencies]
nabda_core = { path = "../nabda_core" }
